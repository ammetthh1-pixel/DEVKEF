<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DevKëf — Dashboard</title>
<meta name="description" content="Suis ta progression, tes récompenses et ton classement sur DevKëf."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="style.css">
<style>
.track-row{margin-bottom:1.1rem;display:flex;align-items:center;gap:12px}
.track-row:last-child{margin-bottom:0}
.track-row a{flex:1;min-width:0}
.track-top{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.4rem}
.track-top b{font-family:var(--display)}
.track-bar{height:8px;border-radius:100px;background:var(--ink);overflow:hidden}
.track-bar>i{display:block;height:100%;border-radius:100px}
.tb-web{background:linear-gradient(90deg,var(--orange),#FF9B6A)}
.tb-python{background:linear-gradient(90deg,var(--green),#5EE0BC)}
.tb-c{background:linear-gradient(90deg,#7C3AED,#B79CFB)}
.track-lock{font-family:var(--mono);font-size:.68rem;color:var(--orange);white-space:nowrap}
</style>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../auth.js"></script>
</head>
<body>

<aside class="sidebar">
  <a class="sidebar-logo" href="../index.html">
    <img src="../image/logo-mark.png" alt="logo" class="logo-mark" />
    <div class="logo-name">Dev<span>Këf</span></div>
  </a>
  <nav class="sidebar-nav">
    <a class="nav-item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a class="nav-item" href="../level/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2Z"/><path d="M8 7h7"/></svg>Parcours</a>
    <a class="nav-item" href="classement.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4"/><path d="M6 4h12v5a6 6 0 0 1-12 0V4Z"/></svg>Classement</a>
    <a class="nav-item" href="profil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</a>
  </nav>
  <div class="sidebar-foot">
    <div class="avatar" id="sidebar-avatar">T</div>
    <div>
      <div class="foot-name" id="sidebar-name">Toi</div>
      <div class="foot-rank" id="sidebar-rank">Niveau 1</div>
    </div>
  </div>
  <div id="account-banner" style="padding:10px 14px 14px"></div>
</aside>

<main class="main">
  <header class="head">
    <div>
      <h1 class="hello">Salut <span id="hello-name">Toi</span> 👋</h1>
      <p class="sub" id="sub-text">Chargement de ta progression…</p>
    </div>
    <div class="streak" id="streak-box">🔥 <b id="streak-days">1 jour</b> d'affilée</div>
  </header>

  <!-- 1. Progression XP -->
  <section class="card">
    <div class="xp-top">
      <div class="xp-level" id="xp-level-label">Niveau 1</div>
      <div class="xp-num" id="xp-num-label"><b>0</b> / 400 XP</div>
    </div>
    <div class="bar"><i id="xp-bar-fill" style="width:0%"></i></div>
  </section>

  <div class="grid">
    <!-- colonne gauche -->
    <div>
      <!-- 2. Projet en cours -->
      <section class="card" id="current-project-card"></section>

      <!-- 3. Parcours -->
      <section class="card" style="margin-top:1.25rem">
        <h3 class="section-title">Tes parcours <a href="../index.html#parcours">Voir tout</a></h3>
        <div id="tracks-summary"></div>
      </section>
    </div>

    <!-- colonne droite -->
    <div>
      <!-- 4. Mini-classement -->
      <section class="card">
        <h3 class="section-title">Classement <a href="classement.html">Voir tout</a></h3>
        <p id="mini-rank-note" style="font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-bottom:.6rem"></p>
        <div id="mini-rank-list"></div>
      </section>


      <!-- 5. Récompenses -->
      <section class="card" style="margin-top:1.25rem">
        <h3 class="section-title">Récompenses <span id="badges-count">0 / 6</span></h3>
        <p style="font-size:.82rem;color:var(--muted)">Débloque des badges en terminant des projets.</p>
        <div class="badges" id="badges-row"></div>
      </section>
    </div>
  </div>
</main>

<script src="../progress.js"></script>
<script>
(async function initDashboard() {
  await dkSyncPull(); // ne fait rien si non configuré ou non connecté

  const data = dkLoad();
  dkTouchStreak(data);
  dkSave(data);

  // Bandeau statut de compte
  const banner = document.getElementById('account-banner');
  if (dkIsGuest()) {
    banner.innerHTML = `<a href="../login.html" style="display:block;text-align:center;font-family:var(--display);font-size:.72rem;font-weight:600;color:var(--orange);border:1px solid rgba(255,107,53,.3);background:var(--orange-dim);padding:8px;border-radius:8px">🔒 Mode invité — créer un compte</a>`;
  } else {
    banner.innerHTML = `<button onclick="dkSignOut().then(()=>location.reload())" style="width:100%;font-family:var(--display);font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--border-light);background:var(--ink3);padding:8px;border-radius:8px;cursor:pointer">Se déconnecter</button>`;
  }

  const acc = dkGetXPForNextAccountLevel();
  document.getElementById('hello-name').textContent = data.name || 'Toi';
  document.getElementById('sidebar-name').textContent = data.name || 'Toi';
  document.getElementById('sidebar-avatar').textContent = (data.name || 'Toi').slice(0, 2).toUpperCase();
  document.getElementById('sidebar-rank').textContent = 'Niveau ' + acc.level;
  document.getElementById('streak-days').textContent = data.streak + (data.streak > 1 ? ' jours' : ' jour');

  document.getElementById('xp-level-label').textContent = 'Niveau ' + acc.level;
  document.getElementById('xp-num-label').innerHTML = '<b>' + acc.current + '</b> / ' + acc.needed + ' XP';
  document.getElementById('xp-bar-fill').style.width = Math.min(100, (acc.current / acc.needed) * 100) + '%';

  // Projet en cours : premier niveau débloqué et non complété, tous parcours confondus
  const ALL_LEVELS = [
    { track: 'web', label: 'Développement Web', id: 1, title: 'Ma première page', href: '../level/level_1.html', xp: 80, icon: '🌐' },
    { track: 'web', label: 'Développement Web', id: 2, title: 'Texte & liens', href: '../level/level_2.html', xp: 100, icon: '🌐' },
    { track: 'web', label: 'Développement Web', id: 3, title: 'CSS & couleurs', href: '../level/level_3.html', xp: 120, icon: '🌐' },
    { track: 'web', label: 'Développement Web', id: 4, title: 'Flexbox', href: '../level/level_4.html', xp: 150, icon: '🌐' },
    { track: 'web', label: 'Développement Web', id: 5, title: 'Grid', href: '../level/level_5.html', xp: 150, icon: '🌐' },
    { track: 'web', label: 'Développement Web', id: 6, title: 'Responsive', href: '../level/level_6.html', xp: 180, icon: '🌐' },
    { track: 'python', label: 'Python', id: 1, title: 'Calculatrice cliquable', href: '../level/python/level_1.html', xp: 150, icon: '🐍' },
    { track: 'python', label: 'Python', id: 2, title: 'Listes & dictionnaires', href: '../level/python/level_2.html', xp: 130, icon: '🐍' },
    { track: 'python', label: 'Python', id: 3, title: 'Boucles', href: '../level/python/level_3.html', xp: 120, icon: '🐍' },
    { track: 'python', label: 'Python', id: 4, title: 'Chaînes de caractères', href: '../level/python/level_4.html', xp: 130, icon: '🐍' },
    { track: 'python', label: 'Python', id: 5, title: 'Fonctions avancées & récursion', href: '../level/python/level_5.html', xp: 140, icon: '🐍' },
    { track: 'c', label: 'Langage C', id: 1, title: 'Calculatrice cliquable', href: '../level/c/level_1.html', xp: 150, icon: '⚙️' }
  ];
  const playable = l => !dkIsDone(l.track, l.id) && dkIsUnlocked(l.track, l.id) && (l.id === 1 || !dkIsGuest());
  const guestBlocked = l => !dkIsDone(l.track, l.id) && dkIsUnlocked(l.track, l.id) && l.id > 1 && dkIsGuest();

  const next = ALL_LEVELS.find(playable);
  const card = document.getElementById('current-project-card');
  if (next) {
    document.getElementById('sub-text').textContent = 'Ton prochain projet t\'attend : ' + next.title + '.';
    card.innerHTML = `
      <span class="proj-tag">Projet en cours</span>
      <h2 class="proj-title">${next.icon} ${next.title}</h2>
      <p class="proj-desc">${next.label} · Niveau ${next.id} · ★ ${next.xp} XP à la clé.</p>
      <a class="btn" href="${next.href}">Continuer le projet →</a>`;
  } else if (dkIsGuest() && ALL_LEVELS.some(guestBlocked)) {
    document.getElementById('sub-text').textContent = 'Crée un compte pour débloquer la suite.';
    card.innerHTML = `
      <span class="proj-tag" style="color:var(--orange);background:var(--orange-dim)">Compte requis</span>
      <h2 class="proj-title">Tu as fini le niveau gratuit de chaque parcours 🎉</h2>
      <p class="proj-desc">Crée un compte gratuit pour débloquer la suite et sauvegarder ta progression.</p>
      <a class="btn" href="../login.html">Créer un compte →</a>`;
  } else {
    document.getElementById('sub-text').textContent = 'Tu as complété tous les projets disponibles pour l\'instant 🎉';
    card.innerHTML = `
      <span class="proj-tag">Bravo !</span>
      <h2 class="proj-title">Tout est à jour</h2>
      <p class="proj-desc">De nouveaux niveaux arrivent bientôt sur les trois parcours.</p>
      <a class="btn" href="../index.html#parcours">Revoir les parcours →</a>`;
  }

  // Résumé des trois parcours
  const TRACKS = [
    { key: 'web', icon: '🌐', label: 'Développement Web', total: 6, href: '../level/index.html', cls: 'tb-web' },
    { key: 'python', icon: '🐍', label: 'Python', total: 1, href: '../level/python/index.html', cls: 'tb-python' },
    { key: 'c', icon: '⚙️', label: 'Langage C', total: 1, href: '../level/c/index.html', cls: 'tb-c' }
  ];
  document.getElementById('tracks-summary').innerHTML = TRACKS.map(t => {
    const done = dkGetCompletedCount(t.key);
    const pct = Math.min(100, (done / t.total) * 100);
    const locked = dkIsGuest() && done >= 1 && done < t.total;
    return `
      <div class="track-row">
        <a href="${t.href}">
          <div class="track-top"><b>${t.icon} ${t.label}</b><span style="color:var(--muted)">${done} / ${t.total}</span></div>
          <div class="track-bar"><i class="${t.cls}" style="width:${pct}%"></i></div>
        </a>
        ${locked ? '<span class="track-lock">🔒 Compte requis</span>' : ''}
      </div>`;
  }).join('');

  // Mini-classement (vraies données Supabase si configuré, sinon démo)
  let all;
  const real = await dkFetchLeaderboard();
  if (real && real.length) {
    all = real.slice(0, 5).map(p => ({ name: p.username, xp: p.xp, me: !dkIsGuest() && p.username === data.name }));
    if (dkIsGuest() || !all.some(p => p.me)) all.push({ name: data.name || 'Toi', xp: data.xp, me: true });
    all.sort((a, b) => b.xp - a.xp);
    all = all.slice(0, 5);
    document.getElementById('mini-rank-note').textContent = '✓ Classement réel';
  } else {
    const rivals = [
      { name: 'Sara M.', xp: 3420 }, { name: 'Youssef B.', xp: 2980 },
      { name: 'Lina T.', xp: 2110 }, { name: 'Omar D.', xp: 1090 }
    ];
    all = [...rivals, { name: data.name || 'Toi', xp: data.xp, me: true }].sort((a, b) => b.xp - a.xp);
    document.getElementById('mini-rank-note').textContent = '⚠ Démonstration (backend non configuré)';
  }
  document.getElementById('mini-rank-list').innerHTML = all.map((p, i) => `
    <div class="rank-row${p.me ? ' me' : ''}">
      <span class="rank-pos">${i + 1}</span>
      <span class="rank-av">${p.name.slice(0,2).toUpperCase()}</span>
      <span class="rank-name">${p.me ? 'Toi' : p.name}</span>
      <span class="rank-xp">${p.xp.toLocaleString('fr-FR')}</span>
    </div>`).join('');

  // Badges simples dérivés de la progression réelle
  const doneCount = dkGetCompletedCount('web') + dkGetCompletedCount('python') + dkGetCompletedCount('c');
  const badgeDefs = [
    { icon: '🚀', got: doneCount >= 1 },
    { icon: '🔥', got: data.streak >= 3 },
    { icon: '🎯', got: doneCount >= 2 },
    { icon: '🏆', got: doneCount >= 4 },
    { icon: '💎', got: dkGetXP() >= 500 },
    { icon: '⚡', got: doneCount >= 6 }
  ];
  document.getElementById('badges-count').textContent = badgeDefs.filter(b => b.got).length + ' / ' + badgeDefs.length;
  document.getElementById('badges-row').innerHTML = badgeDefs.map(b =>
    `<div class="badge ${b.got ? 'got' : 'locked'}">${b.icon}</div>`).join('');
})();
</script>

</body>
</html>
