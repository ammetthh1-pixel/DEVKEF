<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DevKëf — Parcours Développement Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
<script src="../progress.js"></script>
<script src="../auth.js"></script>
<style>
:root{
  --ink:#0A0E1A; --ink2:#111827; --ink3:#1C2333; --surface:#1A2236;
  --border:#1E2D45; --border-light:#243450;
  --orange:#FF6B35; --orange-dim:rgba(255,107,53,.12);
  --green:#00C896; --green-dim:rgba(0,200,150,.1);
  --violet:#7C3AED; --yellow:#FFD60A;
  --text:#F0F4FF; --muted:#7A8BAD; --muted2:#4A5C78;
  --mono:'Fira Code',monospace; --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}

.topbar{height:56px;background:var(--ink2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:50}
.logo-small{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:.95rem}
.logo-small span{color:var(--orange)}
.logo-mark-sm{width:38px;height:38px}
.btn-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:.78rem;font-weight:600;color:var(--muted);border:1px solid var(--border);background:var(--ink3);padding:7px 12px;border-radius:8px}
.btn-back:hover{color:var(--text);border-color:var(--border-light)}

.wrap{max-width:960px;margin:0 auto;padding:36px 18px 90px}
.crumb{font-family:var(--mono);font-size:.72rem;color:var(--muted2);margin-bottom:10px}
h1.title{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.3rem);font-weight:700;letter-spacing:-.02em}
.subtitle{color:var(--muted);margin-top:8px;font-size:.95rem;max-width:60ch;line-height:1.65}
.xp-summary{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.xp-pill{font-family:var(--display);font-size:.78rem;font-weight:600;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--ink2);color:var(--muted)}
.xp-pill b{color:var(--orange)}

.levels{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.lvl-card{display:flex;align-items:center;gap:16px;background:var(--ink2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:.15s}
.lvl-card.unlocked{cursor:pointer}
.lvl-card.unlocked:hover{border-color:var(--orange);transform:translateY(-1px)}
.lvl-card.locked{opacity:.5}
.lvl-card.guest-locked{cursor:pointer;border-color:rgba(255,107,53,.35)}
.lvl-card.guest-locked:hover{border-color:var(--orange)}
.lvl-card.guest-locked .lvl-num{background:var(--orange-dim);border-color:var(--orange);color:var(--orange)}
.lvl-num{width:44px;height:44px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:.95rem;border:1.5px solid var(--border-light);background:var(--ink);color:var(--muted2)}
.lvl-card.done .lvl-num{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.lvl-card.unlocked .lvl-num{background:var(--orange-dim);border-color:var(--orange);color:var(--orange)}
.lvl-body{flex:1;min-width:0}
.lvl-title{font-family:var(--display);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px}
.lvl-done-tag{font-family:var(--mono);font-size:.65rem;color:var(--green);background:var(--green-dim);border:1px solid rgba(0,200,150,.3);padding:1px 7px;border-radius:20px}
.lvl-desc{color:var(--muted);font-size:.83rem;margin-top:3px}
.lvl-meta{display:flex;gap:8px;margin-top:8px}
.pill{font-family:var(--display);font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:var(--ink3);color:var(--muted)}
.pill.xp{color:var(--yellow);border-color:rgba(255,214,10,.25);background:rgba(255,214,10,.08)}
.lvl-arrow{flex-shrink:0;color:var(--muted2)}
.lvl-card.unlocked .lvl-arrow{color:var(--orange)}
.lock-icon{flex-shrink:0;color:var(--muted2)}
</style>
</head>
<body>

<div class="topbar">
  <a href="../index.html" class="logo-small"><img src="../image/logo-mark.png" alt="logo" class="logo-mark-sm">Dev<span>Këf</span></a>
  <a href="../dashboard/index.html" class="btn-back">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Dashboard
  </a>
</div>

<main class="wrap">
  <div class="crumb">// Monde 1 · Développement web</div>
  <h1 class="title">Développement Web</h1>
  <p class="subtitle">Du titre HTML à l'application interactive. Chaque niveau est un projet concret à construire, avec sa propre maquette et ses objectifs.</p>
  <div class="xp-summary" id="xp-summary"></div>

  <div class="levels" id="levels-list"></div>
</main>

<script>
const TRACK = 'web';
// levelId : {title, desc, tags, xp, href} — href = null tant que le niveau n'est pas construit
const WEB_LEVELS = [
  { id: 1, title: 'Ma première page', desc: 'Structure HTML de base — titres, paragraphes, listes.', tags: ['HTML'], xp: 80, href: 'level_1.html' },
  { id: 2, title: 'Texte & liens', desc: 'Mise en forme du texte et navigation entre pages.', tags: ['HTML'], xp: 100, href: 'level_2.html' },
  { id: 3, title: 'CSS & couleurs', desc: 'Habiller une page : couleurs, typographie, espacements.', tags: ['CSS'], xp: 120, href: 'level_3.html' },
  { id: 4, title: 'Flexbox', desc: 'Carte de profil responsive avec Flexbox.', tags: ['CSS'], xp: 150, href: 'level_4.html' },
  { id: 5, title: 'Grid', desc: 'Mise en page avancée avec CSS Grid.', tags: ['CSS'], xp: 150, href: 'level_5.html' },
  { id: 6, title: 'Responsive', desc: 'Adapter un site complet au mobile.', tags: ['CSS'], xp: 180, href: 'level_6.html' }
];

const lockSvg = `<svg class="lock-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
const arrowSvg = `<svg class="lvl-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>`;

function render() {
  const list = document.getElementById('levels-list');
  list.innerHTML = '';

  WEB_LEVELS.forEach(lvl => {
    const done = dkIsDone(TRACK, lvl.id);
    const prereqOk = dkIsUnlocked(TRACK, lvl.id) && !!lvl.href;
    const guestBlocked = lvl.id > 1 && dkIsGuest();
    const unlocked = prereqOk && !guestBlocked;
    const guestLocked = prereqOk && guestBlocked && !done;
    const state = done ? 'done' : (unlocked ? 'unlocked' : (guestLocked ? 'guest-locked' : 'locked'));

    const tagsHTML = lvl.tags.map(t => `<span class="pill">${t}</span>`).join('') + `<span class="pill xp">★ ${lvl.xp} XP</span>`;
    const badge = done ? '<span class="lvl-done-tag">Complété</span>' : (guestLocked ? '<span class="lvl-done-tag" style="color:var(--orange);background:var(--orange-dim);border-color:rgba(255,107,53,.3)">Compte requis</span>' : '');
    const inner = `
      <div class="lvl-num">${done ? '✓' : lvl.id}</div>
      <div class="lvl-body">
        <div class="lvl-title">${lvl.title} ${badge}</div>
        <div class="lvl-desc">${guestLocked ? 'Crée un compte gratuit pour débloquer ce niveau.' : lvl.desc}</div>
        <div class="lvl-meta">${tagsHTML}</div>
      </div>
      ${unlocked ? arrowSvg : lockSvg}`;

    const el = document.createElement((unlocked || guestLocked) ? 'a' : 'div');
    if (unlocked) el.href = lvl.href;
    if (guestLocked) el.href = '../login.html';
    el.className = 'lvl-card ' + state;
    el.innerHTML = inner;
    list.appendChild(el);
  });

  const xp = dkGetXP();
  const doneCount = dkGetCompletedCount(TRACK);
  document.getElementById('xp-summary').innerHTML = `
    <span class="xp-pill"><b>${xp}</b> XP au total</span>
    <span class="xp-pill">${doneCount} / ${WEB_LEVELS.length} niveaux complétés</span>`;

  if (dkIsGuest()) {
    document.getElementById('xp-summary').innerHTML += `
      <a href="../login.html" class="xp-pill" style="color:var(--orange);border-color:rgba(255,107,53,.3)">🔒 Mode invité — créer un compte</a>`;
  }
}

render();
</script>

</body>
</html>
