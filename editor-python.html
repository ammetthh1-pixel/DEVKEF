<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DevKëf — Éditeur Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="progress.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="calculator.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
:root{
  --ink:#0A0E1A; --ink2:#111827; --ink3:#1C2333; --surface:#1A2236;
  --border:#1E2D45; --border-light:#243450;
  --orange:#FF6B35; --orange-dim:rgba(255,107,53,.12);
  --green:#00C896; --green-dim:rgba(0,200,150,.1);
  --violet:#7C3AED; --yellow:#FFD60A; --red:#FF4757;
  --text:#F0F4FF; --muted:#7A8BAD; --muted2:#4A5C78;
  --mono:'Fira Code',monospace; --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
code{font-family:var(--mono);font-size:.72rem;background:rgba(124,58,237,.16);color:#C4B5FD;padding:1px 5px;border-radius:4px}

.topbar{height:52px;flex-shrink:0;background:var(--ink2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px}
.logo-small{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:.9rem}
.logo-small span{color:var(--orange)}
.logo-mark-sm{width:30px;height:30px}
.level-pill{font-family:var(--mono);font-size:.72rem;background:var(--green-dim);color:var(--green);padding:3px 10px;border-radius:20px;border:1px solid rgba(0,200,150,.25)}
.project-name{font-size:.82rem;color:var(--muted)}
.project-name span{color:var(--text);font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.xp-badge{font-family:var(--display);font-size:.78rem;font-weight:700;color:var(--yellow)}
.pyodide-status{font-family:var(--mono);font-size:.7rem;color:var(--muted2)}
.btn-back-top{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:.75rem;font-weight:600;color:var(--muted);border:1px solid var(--border);background:var(--ink3);padding:6px 11px;border-radius:8px}
.btn-back-top:hover{color:var(--text)}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr 320px}

.panel-instr{background:var(--ink2);border-right:1px solid var(--border);overflow-y:auto;padding:18px}
.instr-level{font-family:var(--mono);font-size:.72rem;color:var(--muted2);margin-bottom:6px}
.instr-title{font-family:var(--display);font-weight:700;font-size:1.15rem}
.instr-xp{font-family:var(--display);font-size:.78rem;color:var(--yellow);margin:6px 0 14px}
.instr-desc{font-size:.82rem;color:var(--muted);line-height:1.6;margin-bottom:18px}
.objectives-title{font-family:var(--display);font-size:.82rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.objectives-title::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--orange)}
.objective{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.objective:last-child{border-bottom:0}
.obj-status{width:20px;height:20px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--border-light);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.68rem}
.objective.done .obj-status{background:var(--green);border-color:var(--green);color:var(--ink)}
.objective.failed .obj-status{background:rgba(255,71,87,.15);border-color:#FF4757;color:#FF4757}
.obj-text{font-size:.82rem;font-weight:500}
.obj-hint{font-size:.72rem;color:var(--muted);margin-top:3px}
.tip-box{background:rgba(0,200,150,.08);border:1px solid rgba(0,200,150,.25);border-radius:12px;padding:13px 15px;margin-top:18px}
.tip-label{font-family:var(--display);font-size:.75rem;font-weight:700;color:var(--green);margin-bottom:5px}
.tip-text{font-size:.78rem;color:var(--muted);line-height:1.6}
.nav-btns{display:flex;gap:8px;margin-top:20px}
.btn-prev,.btn-next{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:600;font-size:.78rem;padding:10px;border-radius:9px;border:1px solid var(--border-light);background:var(--ink3);color:var(--text);cursor:pointer}
.btn-next{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn-next:disabled{opacity:.4;cursor:not-allowed;background:var(--ink3);color:var(--muted);border-color:var(--border-light)}

.panel-editor{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.editor-bar{height:42px;flex-shrink:0;background:var(--ink3);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px}
.editor-bar-label{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.editor-bar-right{margin-left:auto;display:flex;gap:8px}
.btn-run,.btn-validate{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:.75rem;padding:6px 12px;border-radius:7px;border:1px solid var(--border-light);background:var(--ink2);color:var(--text);cursor:pointer}
.btn-validate{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn-run:disabled,.btn-validate:disabled{opacity:.4;cursor:not-allowed}
.CodeMirror{height:100% !important;font-family:var(--mono) !important;font-size:.85rem !important}
.editor-pane{flex:1;min-height:0}
.console{height:130px;flex-shrink:0;background:#0A0E1A;border-top:1px solid var(--border);padding:10px 14px;font-family:var(--mono);font-size:.75rem;color:var(--muted);overflow-y:auto}
.console .err{color:#FF4757}
.console .ok{color:var(--green)}

.panel-app{background:var(--ink2);display:flex;flex-direction:column;align-items:center;padding:20px 16px;overflow-y:auto}
.panel-app-label{font-family:var(--mono);font-size:.7rem;color:var(--muted2);margin-bottom:14px;text-align:center}
.panel-app-body{width:100%;max-width:280px}

/* ── Panneau "contacts" (niveau 2) ── */
.contacts-form{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.contacts-form input{background:var(--ink);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:.85rem}
.contacts-form input:focus{outline:none;border-color:var(--green)}
.contacts-form button{background:var(--green);color:var(--ink);border:0;padding:9px;border-radius:8px;font-family:var(--display);font-weight:700;font-size:.82rem;cursor:pointer}
.contacts-search{display:flex;gap:8px;margin-bottom:14px}
.contacts-search input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:.85rem}
.contacts-search input:focus{outline:none;border-color:var(--orange)}
.contacts-search button{background:var(--orange);color:var(--ink);border:0;padding:9px 11px;border-radius:8px;font-family:var(--display);font-weight:700;font-size:.82rem;cursor:pointer}
.contacts-list{display:flex;flex-direction:column;gap:7px}
.contact-row{display:flex;justify-content:space-between;align-items:center;background:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.82rem}
.contact-del{background:rgba(255,71,87,.12);color:var(--red);border:1px solid rgba(255,71,87,.3);border-radius:6px;width:24px;height:24px;cursor:pointer}
.contacts-empty{color:var(--muted2);font-size:.8rem;text-align:center;padding:14px 0;font-family:var(--mono)}
.contacts-status{color:var(--red);font-size:.75rem;margin-top:8px;min-height:16px}
.contacts-search-status{color:var(--orange);font-size:.75rem;line-height:1.4;min-height:16px;margin:-6px 0 10px}

/* ── Panneau "guess" (niveau 3) ── */
.guess-panel{text-align:center;width:100%}
.guess-secret-hint{font-size:.8rem;color:var(--muted);margin-bottom:14px;line-height:1.5}
.guess-attempts{font-family:var(--mono);font-size:.8rem;color:var(--orange);margin-bottom:14px}
.guess-panel input{width:100%;background:var(--ink);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:1rem;text-align:center;margin-bottom:10px}
.guess-panel input:focus{outline:none;border-color:var(--green)}
#guess-btn{width:100%;background:var(--green);color:var(--ink);border:0;padding:10px;border-radius:8px;font-family:var(--display);font-weight:700;cursor:pointer;margin-bottom:10px}
#guess-btn:disabled{opacity:.4;cursor:not-allowed}
.guess-msg{min-height:24px;font-weight:600;margin-bottom:10px}
.guess-reset{background:transparent;border:1px solid var(--border-light);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:.78rem;cursor:pointer}

/* ── Panneau "textstats" (niveau 4) ── */
.textstats-panel{width:100%}
.textstats-panel textarea{width:100%;background:var(--ink);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:.85rem;font-family:var(--body);resize:vertical;margin-bottom:10px}
.textstats-panel textarea:focus{outline:none;border-color:var(--green)}
.textstats-panel button{width:100%;background:var(--green);color:var(--ink);border:0;padding:9px;border-radius:8px;font-family:var(--display);font-weight:700;cursor:pointer;margin-bottom:12px}
.textstats-results{display:flex;flex-direction:column;gap:7px}
.ts-row{display:flex;justify-content:space-between;align-items:center;background:var(--ink);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.83rem}
.ts-row b{color:var(--green);font-family:var(--display)}
.ts-error{color:var(--red);font-size:.8rem}

/* ── Panneau "recursion" (niveau 5) ── */
.recursion-panel{width:100%;display:flex;flex-direction:column;gap:18px}
.rec-group label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px;font-family:var(--display);font-weight:600}
.rec-group input{width:100%;background:var(--ink);border:1px solid var(--border);color:var(--text);padding:9px;border-radius:8px;font-size:.9rem;margin-bottom:8px}
.rec-group input:focus{outline:none;border-color:var(--green)}
.rec-two-cols{display:flex;gap:8px}
.rec-two-cols input{flex:1}
.rec-group button{width:100%;background:var(--green);color:var(--ink);border:0;padding:9px;border-radius:8px;font-family:var(--display);font-weight:700;cursor:pointer;margin-bottom:8px}
.rec-result{text-align:center;font-family:var(--mono);font-size:.95rem;color:var(--text);background:var(--ink);border:1px solid var(--border);border-radius:8px;padding:10px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink2);border:1px solid var(--border-light);border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.75rem;font-weight:700}
.toast.success .toast-icon{background:var(--green-dim);color:var(--green)}
.toast.error .toast-icon{background:rgba(255,71,87,.15);color:#FF4757}
.toast.info .toast-icon{background:var(--orange-dim);color:var(--orange)}
.toast-title{font-family:var(--display);font-weight:700;font-size:.82rem}
.toast-msg{font-size:.76rem;color:var(--muted);margin-top:2px}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .panel-instr{max-height:180px}
  .panel-app{max-height:none}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo-small"><img src="image/logo-mark.png" alt="logo" class="logo-mark-sm">Dev<span>Këf</span></a>
  <span class="level-pill" id="level-pill">Python · Niveau 1</span>
  <span class="project-name">/ <span id="project-title-text">Calculatrice cliquable</span></span>
  <div class="topbar-right">
    <span class="pyodide-status" id="pyodide-status">Chargement de Python…</span>
    <span class="xp-badge">★ <span id="xp-count">0</span> XP</span>
    <a class="btn-back-top" href="level/python/index.html">Retour</a>
  </div>
</div>

<div class="layout">
  <div class="panel-instr">
    <div class="instr-level" id="instr-level-label">// Monde 2 · Python · Niveau 1</div>
    <div class="instr-title" id="instr-title-label">Calculatrice cliquable</div>
    <div class="instr-xp" id="instr-xp-label">★ 150 XP à gagner</div>
    <p class="instr-desc" id="instr-desc-text"></p>

    <div class="objectives-title">Objectifs à valider</div>
    <div id="objectives-list"></div>

    <div class="tip-box">
      <div class="tip-label">💡 Comment ça marche</div>
      <div class="tip-text" id="tip-text-content"></div>
    </div>

    <a href="#" id="doc-link" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:7px;margin-top:12px;font-family:var(--display);font-size:.78rem;font-weight:600;color:var(--muted);border:1px solid var(--border-light);background:var(--ink3);padding:9px 12px;border-radius:9px">
      📄 Voir la documentation du niveau
    </a>

    <div class="nav-btns">
      <button class="btn-prev" onclick="window.location.href='level/python/index.html'">Retour</button>
      <button class="btn-next" id="btn-next-level" disabled>Niveau suivant</button>
    </div>
  </div>

  <div class="panel-editor">
    <div class="editor-bar">
      <span class="editor-bar-label" id="editor-filename">code.py</span>
      <div class="editor-bar-right">
        <button class="btn-run" id="btn-run" onclick="runOnly()" disabled>Exécuter</button>
        <button class="btn-validate" id="btn-validate" onclick="validateCode()" disabled>Valider</button>
      </div>
    </div>
    <div class="editor-pane"><textarea id="editor-py"></textarea></div>
    <div class="console" id="console">// La sortie s'affiche ici</div>
  </div>

  <div class="panel-app">
    <div class="panel-app-label" id="panel-app-label">Pilotée par ton code Python</div>
    <div class="panel-app-body" id="app-container"></div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-icon" id="toast-icon"></div>
  <div>
    <div class="toast-title" id="toast-title"></div>
    <div class="toast-msg" id="toast-msg"></div>
  </div>
</div>

<script>
const TRACK = 'python';

/* ══════════════════════════════════════
   CONFIG DES NIVEAUX — Python
══════════════════════════════════════ */
const LEVELS = {
  1: {
    title: 'Calculatrice cliquable',
    xpMax: 150,
    desc: "Écris une fonction Python qui calcule le résultat d'une opération. Ton code pilote directement la calculatrice à droite : tape une opération, clique sur \"=\", et c'est ta fonction qui répond — exécutée pour de vrai, dans ton navigateur.",
    tip: "DevKëf exécute du <b>vrai Python</b> dans ta page via Pyodide (Python compilé en WebAssembly). Pas de simulation : c'est ton code qui tourne.",
    panel: 'calculator',
    nextLevel: 2,
    starter: `# Cette fonction est appelée à chaque fois que tu cliques sur "="
# a et b sont deux nombres, op est une chaîne : '+', '-', '*' ou '/'
def calculer(a, op, b):

`,
    objectives: [
      { label: 'Addition', hint: '3 + 4 doit donner 7',
        run: async () => Math.abs((await callPy('calculer', 3, '+', 4)) - 7) < 1e-9 },
      { label: 'Soustraction', hint: '10 − 6 doit donner 4',
        run: async () => Math.abs((await callPy('calculer', 10, '-', 6)) - 4) < 1e-9 },
      { label: 'Multiplication & division', hint: '6 × 7 = 42 et 20 ÷ 4 = 5',
        run: async () => Math.abs((await callPy('calculer', 6, '*', 7)) - 42) < 1e-9 && Math.abs((await callPy('calculer', 20, '/', 4)) - 5) < 1e-9 },
      { label: 'Division par zéro gérée', hint: '5 ÷ 0 doit retourner None sans provoquer d’erreur',
        run: async () => {
          try {
            const result = await callPy('calculer', 5, '/', 0);
            return result === null || result === undefined;
          } catch (e) {
            return false;
          }
        } }
    ]
  },

  2: {
    title: 'Listes & dictionnaires : carnet de contacts',
    xpMax: 130,
    desc: "Un contact, c'est plusieurs informations liées (nom, téléphone) — parfait pour un dictionnaire. Un carnet, c'est une liste de ces dictionnaires. Tes fonctions gèrent le carnet affiché à droite.",
    tip: "Chaque fonction reçoit le carnet actuel et retourne le <b>nouveau</b> carnet (ou l'info demandée) — elle ne modifie rien \"en douce\", elle retourne toujours le résultat avec <code>return</code>.",
    panel: 'contacts',
    nextLevel: 3,
    starter: `# carnet est une liste de dictionnaires : [{"nom": "...", "telephone": "..."}, ...]

def ajouterContact(carnet, nom, telephone):
    # OBJECTIF 1 : retourne un NOUVEAU carnet avec ce contact ajouté
    return carnet

def rechercherContact(carnet, nom):
    # OBJECTIF 2 : retourne le téléphone du contact, ou None si absent
    return None

def supprimerContact(carnet, nom):
    # OBJECTIF 3 : retourne un NOUVEAU carnet sans ce contact
    return carnet
`,
    objectives: [
      { label: 'Ajouter un contact', hint: 'ajoute une entrée au carnet',
        run: async () => {
          const r = await callPy('ajouterContact', [], 'Awa', '771234567');
          return Array.isArray(r) && r.length === 1 && r[0].nom === 'Awa' && r[0].telephone === '771234567';
        } },
      { label: 'Rechercher un contact', hint: 'trouve le bon téléphone, ou None si absent',
        run: async () => {
          const carnet = [{nom:'Awa', telephone:'111'}, {nom:'Modou', telephone:'222'}];
          const found = await callPy('rechercherContact', carnet, 'Modou');
          const notFound = await callPy('rechercherContact', carnet, 'Inconnu');
          return found === '222' && (notFound === null || notFound === undefined);
        } },
      { label: 'Supprimer un contact', hint: 'retire la bonne entrée, garde les autres', 
        run: async () => {
          const carnet = [{nom:'A', telephone:'1'}, {nom:'B', telephone:'2'}, {nom:'C', telephone:'3'}];
          const r = await callPy('supprimerContact', carnet, 'B');
          return Array.isArray(r) && r.length === 2 && r.some(c=>c.nom==='A') && r.some(c=>c.nom==='C') && !r.some(c=>c.nom==='B');
        } },
      { label: 'Séquence complète', hint: 'ajouter 3 contacts puis en supprimer 1 laisse les 2 autres intacts',
        run: async () => {
          let carnet = [];
          carnet = await callPy('ajouterContact', carnet, 'A', '1');
          carnet = await callPy('ajouterContact', carnet, 'B', '2');
          carnet = await callPy('ajouterContact', carnet, 'C', '3');
          carnet = await callPy('supprimerContact', carnet, 'B');
          return carnet.length === 2 && await callPy('rechercherContact', carnet, 'A') === '1' && await callPy('rechercherContact', carnet, 'C') === '3';
        } }
    ]
  },

  3: {
    title: 'Boucles : devine le nombre',
    xpMax: 120,
    desc: "Un nombre secret entre 1 et 100, 7 tentatives. Ta fonction ne joue pas le jeu elle-même — elle répond juste \"trop grand\", \"trop petit\", \"gagné\" ou \"perdu\" pour un essai donné. C'est l'interface à droite qui gère la partie.",
    tip: "Pas de boucle <code>while</code> à écrire ici : ta fonction est appelée une fois par essai, avec le nombre de tentatives qu'il reste.",
    panel: 'guess',
    nextLevel: 4,
    starter: `def verifierEssai(secret, essai, tentativesRestantes):
    # Retourne : "gagné", "trop grand", "trop petit", ou "perdu"
    # OBJECTIF 1 : essai correct -> "gagné"
    # OBJECTIF 2 : essai trop grand / trop petit -> le bon message
    # OBJECTIF 3 : dernier essai (tentativesRestantes == 1) sans succès -> "perdu"
    return "trop petit"
`,
    objectives: [
      { label: 'Essai correct', hint: 'retourne "gagné", peu importe le secret',
        run: async () => (await callPy('verifierEssai', 50, 50, 7)) === 'gagné' && (await callPy('verifierEssai', 23, 23, 3)) === 'gagné' },
      { label: 'Trop grand / trop petit', hint: 'les deux sens sont détectés correctement',
        run: async () => (await callPy('verifierEssai', 50, 70, 7)) === 'trop grand' && (await callPy('verifierEssai', 50, 20, 7)) === 'trop petit' },

def estPalindrome(texte):

def motLePlusLong(texte):

`,

    tip: "Une fonction récursive a toujours deux parties : un <b>cas de base</b> qui arrête la récursion (ex. <code>factorielle(0) == 1</code>), et un <b>cas récursif</b> qui s'appelle elle-même avec une valeur plus petite.",
    panel: 'recursion',
    nextLevel: null,
    starter: `def factorielle(n):

    # OBJECTIF 2 : version RÉCURSIVE
    # Cas de base : n'importe quel nombre à la puissance 0 vaut 1

`,

      { label: 'Les deux fonctions sont récursives', hint: 'chaque fonction doit s\u2019appeler elle-même dans son corps',

    ]

/* Vérification structurelle : la fonction s'appelle-t-elle elle-même dans son propre corps ? */
function pySourceCallsItself(source, fnName) {
  const re = new RegExp('def\\s+' + fnName + '\\s*\\([^)]*\\)\\s*:([\\s\\S]*?)(?=\\ndef\\s|$)');
  const m = source.match(re);
  if (!m) return false;
  const callRe = new RegExp(fnName + '\\s*\\(');
  return callRe.test(m[1]);
}

const params = new URLSearchParams(window.location.search);
const LEVEL_ID = parseInt(params.get('level') || '1', 10);
const LEVEL = LEVELS[LEVEL_ID] || LEVELS[1];

let cmEditor, pyodideInstance = null, currentXP = 0;

async function callPy(fnName, ...args) {
  if (!pyodideInstance) throw new Error('Python est encore en cours de chargement…');
  pyodideInstance.runPython(cmEditor.getValue());
  const fn = pyodideInstance.globals.get(fnName);
  if (!fn) throw new Error(`Fonction "${fnName}" introuvable. Vérifie son nom.`);
  const convertedArgs = args.map(a => (a !== null && typeof a === 'object') ? pyodideInstance.toPy(a) : a);
  let result = fn(...convertedArgs);
  if (result && typeof result.toJs === 'function') {
    const js = result.toJs({ dict_converter: Object.fromEntries });
    result.destroy();
    return js;
  }
  return (result === undefined) ? null : result;
}

function initContactsPanel(container) {
  container.innerHTML = `
    <div class="contacts-form">
      <input id="cf-nom" placeholder="Nom"/>
      <input id="cf-tel" placeholder="Téléphone"/>
      <button id="cf-add">Ajouter</button>
    </div>
    <div class="contacts-search">
      <input id="cf-search" placeholder="Rechercher un nom"/>
      <button id="cf-search-btn">Chercher</button>
    </div>
    <div id="contacts-search-status" class="contacts-search-status"></div>
    <div id="contacts-list" class="contacts-list"></div>
    <div id="contacts-status" class="contacts-status"></div>`;
  let carnet = [];
  const listEl = container.querySelector('#contacts-list');
  const statusEl = container.querySelector('#contacts-status');
  const searchEl = container.querySelector('#cf-search');
  const searchStatusEl = container.querySelector('#contacts-search-status');

  function render() {
    listEl.innerHTML = carnet.length ? carnet.map((c, i) => `
      <div class="contact-row">
        <span>${c.nom} — ${c.telephone}</span>
        <button data-i="${i}" class="contact-del">✕</button>
      </div>`).join('') : '<div class="contacts-empty">Carnet vide</div>';
    listEl.querySelectorAll('.contact-del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const nom = carnet[+btn.dataset.i].nom;
        try { carnet = await callPy('supprimerContact', carnet, nom); statusEl.textContent = ''; }
        catch (e) { statusEl.textContent = 'Erreur : ' + e.message; }
        render();
      });
    });
  }

  container.querySelector('#cf-add').addEventListener('click', async () => {
    const nomEl = container.querySelector('#cf-nom'), telEl = container.querySelector('#cf-tel');
    const nom = nomEl.value.trim(), tel = telEl.value.trim();
    if (!nom || !tel) return;
    try { carnet = await callPy('ajouterContact', carnet, nom, tel); nomEl.value = ''; telEl.value = ''; statusEl.textContent = ''; }
    catch (e) { statusEl.textContent = 'Erreur : ' + e.message; }
    render();
  });

  container.querySelector('#cf-search-btn').addEventListener('click', async () => {
    const nom = searchEl.value.trim();
    if (!nom) {
      searchStatusEl.textContent = 'Saisis un nom à rechercher.';
      return;
    }
    try {
      const telephone = await callPy('rechercherContact', carnet, nom);
      searchStatusEl.textContent = telephone === null || telephone === undefined
        ? `Aucun contact trouvé pour « ${nom} ».`
        : `${nom} — ${telephone}`;
      statusEl.textContent = '';
    } catch (e) {
      searchStatusEl.textContent = 'Erreur : ' + e.message;
    }
  });

  render();
}

function initGuessPanel(container) {
  container.innerHTML = `
    <div class="guess-panel">
      <div class="guess-secret-hint">Nombre secret entre 1 et 100. 7 essais.</div>
      <div class="guess-attempts" id="guess-attempts">7 essais restants</div>
      <input id="guess-input" type="number" min="1" max="100" placeholder="Ton essai"/>
      <button id="guess-btn">Essayer</button>
      <div id="guess-msg" class="guess-msg"></div>
      <button id="guess-reset" class="guess-reset">🔄 Nouvelle partie</button>
    </div>`;
  let secret, remaining;
  const attemptsEl = container.querySelector('#guess-attempts');
  const msgEl = container.querySelector('#guess-msg');
  const inputEl = container.querySelector('#guess-input');
  const btnEl = container.querySelector('#guess-btn');

  function newGame() {
    secret = 1 + Math.floor(Math.random() * 100);
    remaining = 7;
    attemptsEl.textContent = remaining + ' essais restants';
    msgEl.textContent = '';
    msgEl.style.color = '';
    inputEl.disabled = false; btnEl.disabled = false;
    inputEl.value = '';
  }

  btnEl.addEventListener('click', async () => {
    const val = parseInt(inputEl.value, 10);
    if (isNaN(val)) return;
    let result;
    try { result = await callPy('verifierEssai', secret, val, remaining); }
    catch (e) { msgEl.textContent = 'Erreur : ' + e.message; msgEl.style.color = 'var(--red)'; return; }
    remaining--;
    attemptsEl.textContent = Math.max(remaining, 0) + ' essais restants';
    const msgs = { 'gagné': '🎉 Gagné !', 'trop grand': '📉 Trop grand', 'trop petit': '📈 Trop petit', 'perdu': '💀 Perdu — c\u2019était ' + secret };
    msgEl.textContent = msgs[result] || ('Réponse inattendue : "' + result + '"');
    msgEl.style.color = result === 'gagné' ? 'var(--green)' : (result === 'perdu' ? 'var(--red)' : 'var(--text)');
    if (result === 'gagné' || result === 'perdu' || remaining <= 0) { inputEl.disabled = true; btnEl.disabled = true; }
  });
  container.querySelector('#guess-reset').addEventListener('click', newGame);
  newGame();
}

function initTextStatsPanel(container) {
  container.innerHTML = `
    <div class="textstats-panel">
      <textarea id="ts-input" rows="3" placeholder="Écris un texte...">Le chat mange rapidement</textarea>
      <button id="ts-run">Analyser</button>
      <div id="ts-results" class="textstats-results"></div>
    </div>`;
  async function run() {
    const texte = container.querySelector('#ts-input').value;
    const resEl = container.querySelector('#ts-results');
    try {
      const mots = await callPy('compterMots', texte);
      const palin = await callPy('estPalindrome', texte);
      const long = await callPy('motLePlusLong', texte);
      resEl.innerHTML = `
        <div class="ts-row"><span>Mots</span><b>${mots}</b></div>
        <div class="ts-row"><span>Palindrome ?</span><b>${palin ? 'Oui' : 'Non'}</b></div>
        <div class="ts-row"><span>Mot le plus long</span><b>${long}</b></div>`;
    } catch (e) { resEl.innerHTML = `<div class="ts-error">Erreur : ${e.message}</div>`; }
  }
  container.querySelector('#ts-run').addEventListener('click', run);
  run();
}

function initRecursionPanel(container) {
  container.innerHTML = `

    catch (e) { resEl.textContent = 'Erreur : ' + e.message; resEl.style.color = 'var(--red)'; }
  });
  container.querySelector('#rec-pow-btn').addEventListener('click', async () => {

    try { resEl.textContent = base + '^' + exp + ' = ' + (await callPy('puissance', base, exp)); resEl.style.color = ''; }
    catch (e) { resEl.textContent = 'Erreur : ' + e.message; resEl.style.color = 'var(--red)'; }

function initPanel() {
  const container = document.getElementById('app-container');
  const labels = { calculator: 'Pilotée par ton code Python', contacts: 'Carnet piloté par ton code', guess: 'Le jeu appelle ta fonction à chaque essai', textstats: 'Analyse pilotée par tes fonctions', recursion: 'Chaque calcul appelle ta fonction récursive' };
  document.getElementById('panel-app-label').textContent = labels[LEVEL.panel] || '';
  if (LEVEL.panel === 'calculator') {
    initCalculator(container, async (a, op, b) => await callPy('calculer', a, op, b));
  } else if (LEVEL.panel === 'contacts') {
    initContactsPanel(container);
  } else if (LEVEL.panel === 'guess') {
    initGuessPanel(container);
  } else if (LEVEL.panel === 'textstats') {
    initTextStatsPanel(container);
  } else if (LEVEL.panel === 'recursion') {
    initRecursionPanel(container);
  }
}

function logConsole(msg, cls) {
  document.getElementById('console').innerHTML = cls ? `<span class="${cls}">${msg}</span>` : msg;
}

async function runOnly() {
  try {
    pyodideInstance.runPython(cmEditor.getValue());
    logConsole('✓ Code exécuté sans erreur.', 'ok');
  } catch (e) {
    logConsole('✗ Erreur Python : ' + e.message, 'err');
  }
}

async function validateCode() {
  if (!pyodideInstance) { showToast('error', 'Python n\u2019est pas prêt', 'Patiente quelques secondes puis réessaie.'); return; }
  let passed = 0;
  const total = LEVEL.objectives.length;

  for (let i = 0; i < total; i++) {
    const num = i + 1;
    let ok = false;
    try { ok = !!(await LEVEL.objectives[i].run()); } catch (e) { ok = false; }
    const el = document.getElementById('obj-' + num);
    const st = document.getElementById('obj-' + num + '-status');
    el.classList.toggle('done', ok);
    el.classList.toggle('failed', !ok);
    st.textContent = ok ? '✓' : '✗';
    if (ok) passed++;
  }

  const xp = Math.round((passed / total) * LEVEL.xpMax);
  currentXP = xp;
  document.getElementById('xp-count').textContent = xp;

  if (passed === total) {
    logConsole('✓ Tous les tests passent — bravo !', 'ok');
    showToast('success', '🎉 Niveau ' + LEVEL_ID + ' validé !', 'Tu as gagné ' + LEVEL.xpMax + ' XP.');
    dkCompleteLevel(TRACK, LEVEL_ID, LEVEL.xpMax);
    const nextBtn = document.getElementById('btn-next-level');
    if (LEVEL.nextLevel) {
      nextBtn.disabled = false;
      nextBtn.onclick = () => window.location.href = 'editor-python.html?level=' + LEVEL.nextLevel;
    }
  } else {
    logConsole(`✗ ${passed}/${total} tests réussis — regarde les objectifs à gauche.`, 'err');
    showToast(passed > 0 ? 'info' : 'error', `${passed}/${total} objectifs atteints`, 'Continue, tu y es presque !');
  }
}

function showToast(type, title, msg) {
  const toast = document.getElementById('toast');
  const icons = { success: '✓', error: '✗', info: '★' };
  toast.className = 'toast ' + type;
  document.getElementById('toast-icon').textContent = icons[type];
  document.getElementById('toast-title').textContent = title;
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4000);
}
